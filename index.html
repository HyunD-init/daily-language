<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>매일 학습 아카이브</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root {
    --bg:#ffffff; --text:#37352f; --text-2:#6b6a67; --text-3:#9b9a97;
    --divider:#e9e9e7; --hover:#f7f6f3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#191919; --text:#d4d4d4; --text-2:#9b9a97; --text-3:#787774;
      --divider:#2f2f2f; --hover:#232323;
    }
  }
  :root[data-theme="dark"] {
    --bg:#191919; --text:#d4d4d4; --text-2:#9b9a97; --text-3:#787774;
    --divider:#2f2f2f; --hover:#232323;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Inter","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:16px; line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  .page { max-width:720px; margin:0 auto; padding:64px 24px 120px; }
  .page-icon { font-size:60px; line-height:1; margin-bottom:12px; }
  h1 { font-size:38px; font-weight:700; line-height:1.2; letter-spacing:-0.02em; margin:0 0 8px; }
  .sub { color:var(--text-3); font-size:15px; margin-bottom:40px; }
  .card {
    display:flex; align-items:center; gap:16px;
    padding:18px 16px; margin:0 -16px;
    border-radius:6px; text-decoration:none; color:inherit;
    border-bottom:1px solid var(--divider);
  }
  .card:hover { background:var(--hover); }
  .card:focus-visible { outline:2px solid #0b6e99; outline-offset:-2px; }
  .card .ico { font-size:30px; flex:none; }
  .card .name { font-size:17px; font-weight:600; }
  .card .desc { color:var(--text-2); font-size:14.5px; }
  .card .go { margin-left:auto; color:var(--text-3); font-size:20px; flex:none; }
  footer { margin-top:56px; color:var(--text-3); font-size:13px; }
</style>
</head>
<body>
<div class="page">
  <div class="page-icon">📚</div>
  <h1>매일 학습 아카이브</h1>
  <div class="sub">매일 아침 자동으로 새 회차가 쌓입니다</div>

  <a class="card" href="./chinese/">
    <span class="ico">🀄</span>
    <span>
      <span class="name">매일 중국어 한 덩어리</span><br>
      <span class="desc">실전 회화 표현 + 병원 문진 · 매일 09:00</span>
    </span>
    <span class="go">→</span>
  </a>

  <a class="card" href="./english/">
    <span class="ico">✈️</span>
    <span>
      <span class="name">여행자의 한 마디</span><br>
      <span class="desc">미국 일상 회화 1 + 여행 실전 2 · 매일 08:00</span>
    </span>
    <span class="go">→</span>
  </a>

  <footer>주소는 고정입니다 — 즐겨찾기 해두세요.</footer>
</div>
</body>
</html>
